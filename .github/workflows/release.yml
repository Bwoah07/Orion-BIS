name: Release

# Every push to main checks the version in OrionBiS.toc. If it hasn't been released yet, the
# workflow tags it and uploads the build to CurseForge and GitHub Releases. So to release:
# bump "## Version", add a CHANGELOG.md entry, merge.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the new version
        id: tag
        run: |
          version=$(grep -m1 '^## Version:' OrionBiS.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r[:space:]')
          if [ -z "$version" ]; then echo "No version in OrionBiS.toc"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version is already released, nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A tag left over from a run that didn't finish is moved to this commit.
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            if [ "$(git rev-parse "$version^{commit}")" != "$(git rev-parse HEAD)" ]; then
              git tag -d "$version"
              git push origin ":refs/tags/$version"
            fi
          fi
          if ! git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            git tag -a "$version" -m "$version"
            git push origin "$version"
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"

      # The packager skips a tag it finds while building a branch push (it expects a separate tag
      # run, which a tag pushed by this workflow never starts), so run it as a tag build.
      - name: Package and upload
        if: steps.tag.outputs.new == 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/BigWigsMods/packager/v2/release.sh -o "$RUNNER_TEMP/release.sh"
          GITHUB_REF="refs/tags/${{ steps.tag.outputs.version }}" GITHUB_REF_NAME="${{ steps.tag.outputs.version }}" bash "$RUNNER_TEMP/release.sh"
